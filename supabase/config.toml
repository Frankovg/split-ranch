# Supabase CLI local stack (`supabase start`). Only Auth and Postgres are used by Split Ranch.
# The cloud project (split-ranch-prod, Free plan) must mirror the [auth] settings below — see infra/README.md.
project_id = "split-ranch"

[api]
enabled = true
port = 54321
# The private "app" schema is intentionally NOT exposed through the Data API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "splitranch://"
additional_redirect_urls = ["splitranch://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
