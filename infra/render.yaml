# Render Blueprint — one Free web service (Frankfurt) running the FastAPI API. There is no
# background worker: nothing runs outside a request. The pre-deploy command needs a paid plan,
# so migrations run at the end of the build.
# The database is Supabase Postgres (not managed here). Env vars come from the env group
# (see infra/README.md).
#
# Free instances spin down after 15 min without traffic and take ~1 min to wake up.
services:
  - type: web
    name: split-ranch-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: apps/api
    branch: main
    # Deploy only when the CI checks on main pass.
    autoDeployTrigger: checksPass
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn split_ranch.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - fromGroup: split-ranch-prod
