packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  # The binary comes from @sentry/cli's per-platform optional packages; its postinstall is not needed.
  "@sentry/cli": false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - expo-dev-client@58.0.21
  - expo-dev-launcher@58.0.21
  - expo-router@58.0.32
nodeLinker: hoisted
