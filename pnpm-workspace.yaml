packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  # The binary comes from @sentry/cli's per-platform optional packages; its postinstall is not needed.
  "@sentry/cli": false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.21 || 58.1.22"
  - "@expo/metro-config@58.0.23 || 58.0.24"
  - "@expo/router-server@58.0.23 || 58.0.24"
  - babel-preset-expo@58.0.26 || 58.0.27
  - expo-file-system@58.0.14 || 58.0.15
  - expo@58.0.26 || 58.1.0
  - expo-dev-client@58.0.21 || 58.0.22
  - expo-dev-launcher@58.0.21 || 58.1.0
  - expo-router@58.0.32 || 58.0.33
  - "@expo/config-plugins@58.0.14"
  - "@expo/config@58.0.13"
  - "@expo/fingerprint@0.22.0"
  - "@expo/inline-modules@0.2.11"
  - "@expo/local-build-cache-provider@58.0.13"
  - "@expo/metro-file-map@58.0.7"
  - "@expo/prebuild-config@58.0.21"
  - "@sentry/expo-upload-sourcemaps@8.37.0"
  - "@sentry/react-native@8.37.0"
  - expo-crypto@58.0.9
  - expo-glass-effect@58.0.6
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo-notifications@58.1.10
  - expo-splash-screen@58.0.15
  - expo-updates@58.0.23
nodeLinker: hoisted
permissions:
  react-native-nitro-google-signin:
    skills: true
skills:
  dirs:
    - .claude/skills
